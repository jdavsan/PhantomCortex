name: Pruebas

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar credenciales de prueba
        # SMTP_SERVER/PORT/USER/PASSWORD son obligatorias para que la aplicación
        # arranque (threatintel.config.REQUIRED_SECRETS), aunque las pruebas nunca
        # envían correo real: credentials.env.example las deja comentadas a propósito
        # (alguien que instala de verdad debe poner las suyas), así que aquí se
        # completan con valores ficticios solo para que la suite pueda arrancar.
        run: |
          cp config/credentials.env.example config/credentials.env
          cat >> config/credentials.env <<'VARS'
          SMTP_SERVER=localhost
          SMTP_PORT=25
          SMTP_USER=pruebas@ejemplo.local
          SMTP_PASSWORD=solo-para-pruebas-de-ci
          VARS

      - name: Ejecutar la suite de pruebas
        run: python -m unittest discover -s tests -p "test_*.py" -v
