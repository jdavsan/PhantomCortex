# Punto de entrada unico de la plataforma: nginx hace la terminacion TLS en el 443 y
# reenvia a la aplicacion (waitress) que escucha SOLO en 127.0.0.1:9090.
# Instalado en /etc/nginx/sites-available/omniguard (enlace en sites-enabled).
# Documentacion: docs/TLS_NGINX_2026-09-08.md
#
# Certificado: /etc/ssl/inteligencia-amenazas/plataforma.{crt,key} (DigiCert, comodin
# *.ejemplo.local, caduca el 29 de enero de 2027). Renovar: copiar los dos ficheros con
# los mismos nombres, root:root, clave 600, y «nginx -t && systemctl reload nginx».
#
# Revision adversaria del 8 de septiembre de 2026: solo se atienden los DOS nombres
# conocidos (el DNS y la IP). Cualquier otra cabecera Host se corta sin respuesta (444):
# antes el 80 redirigia a «https://<lo que dijera el cliente>» (redireccion abierta por
# Host) y el 443 entregaba a la aplicacion cualquier Host.


server {
    listen 80;
    listen [::]:80;
    server_name plataforma.ejemplo.local 10.10.11.10;
    server_tokens off;
    # Toda peticion, llegue por la IP o por el nombre, va al nombre canonico (peticion
    # del usuario del 8 de septiembre de 2026). Requiere que el DNS resuelva el nombre.
    return 301 https://plataforma.ejemplo.local$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    server_tokens off;
    ssl_certificate     /etc/ssl/inteligencia-amenazas/plataforma.crt;
    ssl_certificate_key /etc/ssl/inteligencia-amenazas/plataforma.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

# Por la IP en el 443: el navegador avisa del nombre del certificado (que no cubre la IP)
# y despues se le lleva al nombre canonico, donde no hay aviso.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 10.10.11.10;
    server_tokens off;
    ssl_certificate     /etc/ssl/inteligencia-amenazas/plataforma.crt;
    ssl_certificate_key /etc/ssl/inteligencia-amenazas/plataforma.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://plataforma.ejemplo.local$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plataforma.ejemplo.local;
    server_tokens off;

    # Certificado publico de DigiCert (comodin *.ejemplo.local, RSA 4096, valido hasta el
    # 29 de enero de 2027) con su cadena intermedia y raiz en el mismo fichero. Instalado el
    # 8 de septiembre de 2026 en sustitucion del temporal autofirmado.
    ssl_certificate     /etc/ssl/inteligencia-amenazas/plataforma.crt;
    ssl_certificate_key /etc/ssl/inteligencia-amenazas/plataforma.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:omniguard:10m;
    ssl_session_tickets off;

    # HSTS activado el 8 de septiembre de 2026 con el certificado de DigiCert (CA publica en la
    # que confian todos los navegadores): un ano. Los navegadores lo ignoran para direcciones
    # IP, asi que entrar por https://10.10.11.10 (aviso de nombre) sigue siendo posible.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Sin compresion: las paginas autenticadas llevan el token CSRF de la sesion y comprimir
    # texto con secretos abre la puerta a BREACH; en red local la compresion no aporta nada.
    gzip off;

    # Las cabeceras de seguridad (Content-Security-Policy, X-Frame-Options, etc.) las pone
    # la aplicacion y pasan tal cual: aqui no se duplican para que haya una sola fuente.

    client_max_body_size 41m;      # igual que MAX_CONTENT_LENGTH de la aplicacion (SBOM, OpenSCAP)
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;       # el Panel llega a tardar 3 segundos; margen para informes

    # Registros: formato «combined» (direccion IP, ruta con parametros, navegador); se crean
    # con 640 www-data:adm por logrotate (diario, 14 dias, comprimidos). Sin datos de sesion.
    access_log /var/log/nginx/omniguard.access.log;
    error_log  /var/log/nginx/omniguard.error.log warn;

    # Errores que la aplicacion no puede pintar (cuerpo demasiado grande, aplicacion caida o
    # sin responder): pagina propia en espanol, sin estilos ni scripts, con HSTS y CSP.
    error_page 413 502 503 504 /_nginx/error.html;
    location ^~ /_nginx/ {
        internal;
        alias /var/www/omniguard/;
        # Sin este 0, la redireccion interna del 413 vuelve a comprobar el tamano del cuerpo
        # y nginx sirve su pagina por defecto en ingles. La ubicacion es interna: no se
        # puede pedir desde fuera, asi que no abre ninguna via de subida.
        client_max_body_size 0;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Un solo salto y SIN concatenar lo que envie el cliente: la aplicacion (ProxyFix,
        # un nivel) toma esta cabecera como direccion real para la auditoria.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
