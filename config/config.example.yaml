# PhantomCortex Configuration File
# Copy this file to config.yaml and customize

# ==================================================================
# GENERAL SETTINGS
# ==================================================================
general:
  # Project name (for reports and emails)
  project_name: PhantomCortex
  
  # Timezone for timestamps (IANA format)
  timezone: UTC
  
  # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_level: INFO
  
  # Data retention (days)
  data_retention_days: 90

# ==================================================================
# RSS FEED SOURCES
# ==================================================================
feeds:
  # Enable/disable feed collection
  enabled: true
  
  # Maximum age of articles to process (days)
  max_age_days: 30
  
  # Timeout for each feed request (seconds)
  timeout: 30
  
  # Number of retries for failed requests
  retries: 3
  
  # External sources file
  sources_file: config/sources.yaml
  
  # Rate limiting (requests per minute)
  rate_limit: 60

# ==================================================================
# TECHNOLOGIES TO MONITOR
# ==================================================================
technologies:
  # External technologies file
  technologies_file: config/technologies.yaml
  
  # Case sensitive matching
  case_sensitive: false
  
  # Minimum matches to consider relevant
  min_matches: 1

# ==================================================================
# TRANSLATION SETTINGS
# ==================================================================
translation:
  # Enable automatic translation
  enabled: true
  
  # Source language (ISO 639-1 code)
  source_lang: en
  
  # Target language (ISO 639-1 code)
  target_lang: es
  
  # Use offline translation (Argos Translate)
  offline: true
  
  # Fallback to online services if offline fails
  fallback_online: false
  
  # Maximum text length to translate (characters)
  max_length: 2000

# ==================================================================
# SEVERITY CLASSIFICATION
# ==================================================================
severity:
  # Keywords for CRITICAL severity
  critical_keywords:
    - critical
    - rce
    - remote code execution
    - unauthenticated
    - zero-day
    - zero day
    - 0-day
    - actively exploited
    - in the wild
    - ransomware
    - wormable
    
  # Keywords for HIGH severity
  high_keywords:
    - high
    - privilege escalation
    - authentication bypass
    - sql injection
    - buffer overflow
    - arbitrary code
    - denial of service
    
  # CVSS score thresholds
  cvss_critical: 9.0
  cvss_high: 7.0
  cvss_medium: 4.0

# ==================================================================
# EMAIL ALERTS
# ==================================================================
email:
  # Enable email alerts
  enabled: true
  
  # SMTP Settings
  smtp:
    server: smtp.example.com
    port: 587
    use_tls: true
    use_ssl: false
    username: alerts@example.com
    password: ""  # Use environment variable: PHANTOMCORTEX_EMAIL_PASSWORD
    
  # Email addresses
  from_address: phantomcortex@example.com
  from_name: PhantomCortex Threat Intel
  
  to_addresses:
    - security-team@example.com
    - soc@example.com
    
  cc_addresses: []
  
  bcc_addresses: []
  
  # Alert thresholds
  severity_threshold: HIGH  # Only send alerts for HIGH and CRITICAL
  
  # Maximum alerts per email
  max_alerts_per_email: 10
  
  # Email template
  template: config/templates/alert_email.html
  
  # Send daily digest even if no new threats
  send_empty_digest: false

# ==================================================================
# REPORTING
# ==================================================================
reports:
  # Enable automatic reports
  enabled: true
  
  # Report format: docx, pdf (pdf requires additional dependencies)
  format: docx
  
  # Monthly report generation
  monthly:
    enabled: true
    day_of_month: 28  # Day to generate report (1-31)
    
  # Report output directory
  output_dir: data/reports
  
  # Include charts and graphs
  include_charts: true
  
  # Report template
  template: config/templates/monthly_report.docx
  
  # Auto-send reports via email
  auto_send: true

# ==================================================================
# DATA STORAGE
# ==================================================================
storage:
  # Base directory for data files
  data_dir: data
  
  # Subdirectories
  cache_dir: data/cache
  feeds_dir: data/feeds
  reports_dir: data/reports
  
  # JSON file names
  daily_threats: daily_threats.json
  monthly_threats: monthly_threats_{year}_{month}.json
  seen_threats: seen_threats.json
  
  # Duplicate detection
  deduplication:
    enabled: true
    method: hash  # hash, cve, url
    
  # Backup settings
  backup:
    enabled: true
    frequency: weekly  # daily, weekly, monthly
    retention_count: 4
    backup_dir: data/backups

# ==================================================================
# LOGGING
# ==================================================================
logging:
  # Enable file logging
  file_logging: true
  
  # Log directory
  log_dir: logs
  
  # Log file rotation
  rotation:
    max_bytes: 10485760  # 10MB
    backup_count: 5
    
  # Console output
  console_output: true
  console_colors: true
  
  # Log file names
  files:
    main: phantomcortex.log
    collection: collection.log
    translation: translation.log
    alerts: alerts.log
    reports: reports.log

# ==================================================================
# ADVANCED SETTINGS
# ==================================================================
advanced:
  # Parallel processing
  parallel:
    enabled: true
    max_workers: 4
    
  # Caching
  cache:
    enabled: true
    ttl: 3600  # Time to live in seconds
    
  # API (Future feature)
  api:
    enabled: false
    host: 0.0.0.0
    port: 8080
    
  # Webhook notifications (Future feature)
  webhooks:
    enabled: false
    urls: []
    
  # Integrations (Future feature)
  integrations:
    slack:
      enabled: false
      webhook_url: ""
    teams:
      enabled: false
      webhook_url: ""
    siem:
      enabled: false
      type: ""  # splunk, elastic, qradar

# ==================================================================
# SECURITY
# ==================================================================
security:
  # Encrypt sensitive data at rest
  encrypt_data: false
  
  # API key for authenticated endpoints (future)
  api_key: ""
  
  # IP whitelist for API access (future)
  ip_whitelist: []
  
  # Rate limiting for API (future)
  api_rate_limit: 100

# ==================================================================
# NOTES
# ==================================================================
# - Use environment variables for sensitive data (passwords, API keys)
# - Format: PHANTOMCORTEX_<SECTION>_<KEY>
# - Example: PHANTOMCORTEX_EMAIL_PASSWORD
# - Boolean values: true/false (lowercase)
# - Leave password fields empty and use environment variables
