version: '3.8'

services:
  # Servidor web - Inteligencia de Amenazas
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inteligencia-amenazas-web
    ports:
      - "9090:9090"
    environment:
      LOG_LEVEL: INFO
      FLASK_ENV: production
    volumes:
      # Base de datos
      - ./data:/app/data
      # Logs
      - ./logs:/app/logs
      # Configuración
      - ./config:/app/config
      # Credentials
      - ./config/credentials.env:/app/config/credentials.env:ro
    depends_on:
      - db
    networks:
      - amenazas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Base de datos MariaDB (opcional, para OCS Inventory)
  # Descomenta si necesitas conectar con OCS Inventory vía MariaDB
  # db:
  #   image: mariadb:11-alpine
  #   container_name: inteligencia-amenazas-db
  #   environment:
  #     MYSQL_ROOT_PASSWORD: rootpassword
  #     MYSQL_DATABASE: threat_intel
  #     MYSQL_USER: appuser
  #     MYSQL_PASSWORD: apppassword
  #   volumes:
  #     - db-data:/var/lib/mysql
  #   networks:
  #     - amenazas-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  amenazas-network:
    driver: bridge

volumes:
  # Descomenta si usas el servicio de DB
  # db-data:
  #   driver: local
